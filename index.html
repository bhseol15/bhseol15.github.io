<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart QR - 스마트 QR 메이커</title>
  
  <!-- Pretendard & Plus Jakarta Sans 서체 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Pretendard', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QR Code Styling CDN -->
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full bg-slate-900 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white flex flex-col overflow-hidden relative">

  <!-- ================= 마우스 위치 반응형 인터랙티브 그라데이션 배경 ================= -->
  <div id="interactiveBg" class="fixed inset-0 pointer-events-none overflow-hidden z-0 transition-opacity duration-1000">
    <!-- 베이스 백드롭 -->
    <div class="absolute inset-0 bg-[#0f111a]"></div>

    <!-- 마우스 위치에 반응하는 대형 앰비언트 글로우 오브젝트들 -->
    <div id="glowBlob1" class="glow-orb absolute w-[700px] h-[700px] rounded-full blur-[140px] opacity-60 transition-transform duration-700 ease-out"></div>
    <div id="glowBlob2" class="glow-orb absolute w-[650px] h-[650px] rounded-full blur-[150px] opacity-50 transition-transform duration-1000 ease-out"></div>
    <div id="glowBlob3" class="glow-orb absolute w-[550px] h-[550px] rounded-full blur-[130px] opacity-55 transition-transform duration-500 ease-out"></div>
    
    <!-- 마우스 커서를 은은하게 따라다니는 스포트라이트 라이트 -->
    <div id="mouseSpotlight" class="absolute w-[450px] h-[450px] rounded-full blur-[100px] opacity-45 -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-opacity duration-300"></div>

    <!-- 유리 질감 매트릭스 도트 그리드 & 비네팅 효과 -->
    <div class="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.08)_1px,transparent_1px)] [background-size:28px_28px] opacity-40"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-slate-950/40"></div>
  </div>

  <!-- ================= [요구사항 1 & 2] 상단 헤더 바 ================= -->
  <header class="w-full fixed top-0 left-0 z-30 px-6 sm:px-12 py-5 flex items-center justify-between">
    
    <!-- [요구사항 1] 화면 상단 좌측: logo.png 파일 삽입 -->
    <div class="flex items-center space-x-3.5">
      <a href="./" class="flex items-center space-x-3.5 group">
        <div id="headerLogoBox" class="relative w-12 h-12 rounded-2xl p-[1.5px] bg-gradient-to-b from-white/30 via-white/10 to-white/5 shadow-2xl backdrop-blur-2xl transition-all duration-300 group-hover:scale-105">
          <div class="w-full h-full bg-slate-900/80 rounded-[14px] flex items-center justify-center overflow-hidden p-1.5 border border-white/10">
            <!-- logo.png 파일 이미지 -->
            <img 
              id="siteLogo" 
              src="logo.png" 
              alt="Logo" 
              class="w-full h-full object-contain rounded-lg"
              onerror="this.onerror=null; this.classList.add('hidden'); document.getElementById('logoFallback').classList.remove('hidden');"
            />
            <!-- logo.png가 로컬에 없을 때 표시되는 동적 그라데이션 벡터 아이콘 -->
            <div id="logoFallback" class="hidden w-full h-full rounded-lg bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 text-white flex items-center justify-center text-lg shadow-sm">
              <i class="fa-solid fa-qrcode"></i>
            </div>
          </div>
        </div>
        <div class="hidden sm:flex flex-col">
          <span id="headerSubBadge" class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-400 transition-colors duration-300">Smart QR Studio</span>
          <span class="text-xs font-semibold text-slate-400">All-in-one Maker</span>
        </div>
      </a>
    </div>

    <!-- [요구사항 2] 화면 상단 우측: 사이트 이름 'Smart QR' -->
    <div class="flex items-center space-x-3">
      <div class="flex flex-col items-end">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
            <span id="dynamicStatusDot" class="relative inline-flex rounded-full h-2 w-2 bg-indigo-400 transition-colors duration-300"></span>
          </span>
          <!-- 마우스 위치에 반응하여 그라데이션 각도와 색상이 변하는 텍스트 -->
          <h1 id="siteTitle" class="font-display text-2xl sm:text-3xl font-extrabold tracking-tight select-none drop-shadow-md text-transparent bg-clip-text transition-all duration-300">
            Smart QR
          </h1>
        </div>
        <span class="text-[11px] font-medium text-slate-400/80 hidden sm:inline-block tracking-tight">Interactive Dynamic Gradient</span>
      </div>
    </div>

  </header>

  <!-- ================= 메인 작업 스테이지 ================= -->
  <main class="relative flex-1 w-full h-full flex flex-col items-center justify-center px-4 z-10">

    <!-- [요구사항 4] 정중앙에 나타나는 QR 코드 영역 -->
    <section id="qrContainer" class="hidden opacity-0 scale-75 transition-all duration-700 ease-out flex flex-col items-center justify-center">
      
      <!-- [요구사항 5] QR 코드 카드 (클릭 시 JPG 다운로드) -->
      <div 
        id="qrCard" 
        class="group relative bg-slate-900/60 backdrop-blur-2xl p-6 sm:p-8 rounded-[36px] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.6)] border border-white/10 ring-1 ring-white/15 cursor-pointer transform transition-all duration-500 hover:scale-[1.04] hover:shadow-[0_30px_70px_-10px_rgba(99,102,241,0.35)] active:scale-95"
        title="클릭하면 고화질 JPG 파일로 즉시 다운로드됩니다."
      >
        <!-- 동적 그라데이션 테두리 발광 레이어 -->
        <div id="cardGlowBorder" class="absolute -inset-[1.5px] rounded-[37px] -z-10 blur-sm opacity-80 group-hover:opacity-100 transition duration-500"></div>

        <!-- QR 코드 렌더링 래퍼 (안전한 화이트 베이스) -->
        <div class="relative bg-white rounded-[26px] p-4 sm:p-5 shadow-2xl flex items-center justify-center border border-white/20">
          <div id="qrCodeWrapper" class="flex items-center justify-center">
            <!-- qr-code-styling 에 의해 렌더링 됨 -->
          </div>
        </div>

        <!-- 호버 시 나타나는 감각적인 다운로드 글래스 오버레이 -->
        <div class="absolute inset-0 bg-slate-950/85 backdrop-blur-[6px] rounded-[36px] opacity-0 group-hover:opacity-100 transition-all duration-300 flex flex-col items-center justify-center text-white space-y-3 p-6 text-center shadow-2xl">
          <div id="overlayDownloadIcon" class="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 backdrop-blur-md flex items-center justify-center text-2xl text-white shadow-xl transform translate-y-3 group-hover:translate-y-0 transition-transform duration-300">
            <i class="fa-solid fa-arrow-down-long animate-bounce text-indigo-300"></i>
          </div>
          <div>
            <span class="text-base font-bold tracking-tight block">JPG 다운로드</span>
            <span class="text-xs text-slate-300 font-normal mt-0.5 block">클릭 시 고화질로 저장됩니다</span>
          </div>
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 text-[11px] font-medium text-white/90 border border-white/15">
            <i class="fa-regular fa-image text-indigo-400"></i> High Quality .jpg
          </div>
        </div>
      </div>

      <!-- 하단 안내 배지 & 퀵 다운로드 버튼 -->
      <div class="mt-5 flex items-center gap-3">
        <button 
          type="button" 
          onclick="downloadQRAsJpg()" 
          id="btnQuickDownload"
          class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white text-xs font-semibold shadow-lg shadow-black/20 border border-white/15 backdrop-blur-md active:scale-95 transition-all"
        >
          <i class="fa-solid fa-download text-indigo-400"></i>
          <span>클릭하여 <strong>.jpg</strong> 다운로드</span>
        </button>
      </div>

    </section>

    <!-- [요구사항 3 & 4] 중앙에 위치했다가 확인 시 하단으로 내려가는 URL 입력창 컨테이너 -->
    <div id="urlInputContainer" class="w-full max-w-xl transition-all duration-700 ease-out z-20">
      
      <!-- 헤로 문구 (초기 중앙에 있을 때 표시) -->
      <div id="heroText" class="text-center mb-8 transition-all duration-500">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/15 text-indigo-300 text-xs font-bold mb-4 shadow-inner backdrop-blur-md">
          <span class="flex h-1.5 w-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
          <span>마우스 위치에 따라 반응하는 스마트 그라데이션</span>
        </div>
        <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight leading-tight drop-shadow-md">
          변환할 URL 주소를 <br class="hidden sm:inline" />입력해보세요
        </h2>
        <p class="text-slate-400 text-xs sm:text-sm mt-2 font-medium">
          확인을 누르면 화면 중앙에 스마트 QR 코드가 생성됩니다.
        </p>
      </div>

      <!-- 인터랙티브 플로팅 캡슐 입력 폼 -->
      <form id="qrForm" class="relative group">
        <!-- 마우스 반응형 다이내믹 포커스 글로우 레이어 -->
        <div id="formGlowBorder" class="absolute -inset-[2px] rounded-[28px] blur-md opacity-50 group-focus-within:opacity-100 group-hover:opacity-80 transition duration-500"></div>

        <div class="relative bg-slate-900/70 backdrop-blur-2xl p-2 sm:p-2.5 rounded-[26px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/15 flex items-center gap-2 transition-all duration-300">
          
          <!-- 링크 아이콘 -->
          <div class="pl-4 pr-1 text-indigo-400 text-base sm:text-lg flex items-center justify-center">
            <i class="fa-solid fa-link"></i>
          </div>
          
          <!-- [요구사항 3] URL 입력 필드 -->
          <input 
            type="text" 
            id="urlInput" 
            placeholder="웹사이트 주소 입력 (예: https://naver.com)" 
            class="flex-1 bg-transparent py-3 sm:py-3.5 px-2 text-sm sm:text-base text-white placeholder-slate-400/80 focus:outline-none font-medium selection:bg-indigo-500 selection:text-white"
            autocomplete="off"
            required
          />

          <!-- [요구사항 4] 확인 버튼 -->
          <button 
            type="submit" 
            id="btnSubmit" 
            class="relative overflow-hidden group/btn bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:opacity-95 active:scale-95 text-white font-bold text-xs sm:text-sm px-6 sm:px-7 py-3 sm:py-3.5 rounded-[20px] shadow-lg shadow-indigo-500/30 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
          >
            <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/25 to-transparent -translate-x-full group-hover/btn:translate-x-full transition-transform duration-700"></div>
            <span>확인</span>
            <i class="fa-solid fa-arrow-right text-[11px] transform group-hover/btn:translate-x-0.5 transition-transform"></i>
          </button>
        </div>
      </form>

    </div>

  </main>

  <!-- 세련된 글래스 토스트 알림 UI -->
  <div id="toast" class="fixed bottom-8 right-8 z-50 transform translate-y-24 opacity-0 pointer-events-none transition-all duration-400 flex items-center gap-3 bg-slate-900/90 backdrop-blur-2xl text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-white/15 text-xs sm:text-sm font-semibold">
    <div id="toastIconWrapper" class="w-7 h-7 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm border border-emerald-500/30">
      <i id="toastIcon" class="fa-solid fa-check"></i>
    </div>
    <span id="toastMsg">다운로드가 완료되었습니다.</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
